name: Auto Update Profile README

on:
  schedule:
    # 01:00 in Malaysia (UTC+8).
    - cron: '0 17 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [update-profile]
  pull_request:
    paths: [scripts/**, tests/**, .github/workflows/sync-profile-status.yml]
  push:
    branches: [main]
    paths: [scripts/**, tests/**, .github/workflows/sync-profile-status.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  sync-profile:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sync-profile
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify release tags and update README
        env:
          GH_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
        run: python3 scripts/sync_profile.py
      - name: Commit verified changes
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync verified release tags [skip ci]"
            git push
          fi
